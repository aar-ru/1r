<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Affirm — проверка размеров экрана</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; padding:20px; font:15px/1.5 system-ui,sans-serif; color:#eee; background:#222; }
    h1 { font-size:20px; margin:0 0 12px; }
    select { font:inherit; padding:8px; }
    p { max-width:700px; }
    .stage { overflow:auto; padding:12px 0; }
    iframe { display:block; width:320px; height:568px; border:0; background:#111; }
  </style>
</head>
<body>
  <h1>Проверка размеров экрана</h1>
  <label>Размер <select id="viewport">
    <option value="320x568">320 × 568 — небольшой экран</option>
    <option value="375x812">375 × 812 — телефон</option>
    <option value="430x932">430 × 932 — большой телефон</option>
    <option value="667x375">667 × 375 — горизонтально</option>
  </select></label>
  <p>Обычное приложение в окне выбранного размера. Данные общие с основной страницей в этом браузере. Эта проверка размеров не эмулирует Safari или сенсорный ввод.</p>
  <div class="stage"><iframe src="../index.html" title="Affirm в выбранном размере"></iframe></div>
  <script>
    document.getElementById('viewport').addEventListener('change',event=>{
      const [width,height]=event.target.value.split('x');
      const frame=document.querySelector('iframe');frame.style.width=width+'px';frame.style.height=height+'px';
    });
  </script>
</body>
</html>
