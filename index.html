<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Affirm</title>
  <style>
    :root {
      --glass: rgba(10, 10, 10, 0.28);
      --glass-border: rgba(255, 255, 255, 0.18);
      --text: #fff;
      --muted: rgba(255,255,255,.72);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #0b0b0b; color: var(--text); font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
    body { touch-action: manipulation; }
    @supports (height: 100svh) { body { min-height: 100svh; } }
    button { font: inherit; }

    #feed {
      height: 100vh;
      height: 100dvh;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      scrollbar-width: none;
      background: #0b0b0b;
    }
    #feed::-webkit-scrollbar { display: none; }

    .card {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      overflow: hidden;
      background: #171717;
      isolation: isolate;
    }

    .bg {
      position: absolute;
      inset: -3%;
      background-position: center;
      background-size: cover;
      transform: scale(1.04);
      transition: transform 8s ease;
      z-index: -3;
    }
    .card.active .bg { transform: scale(1.12); }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(180deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,.12) 35%, rgba(0,0,0,.46) 70%, rgba(0,0,0,.72) 100%),
        radial-gradient(circle at 50% 38%, rgba(0,0,0,.04), rgba(0,0,0,.38) 78%);
    }

    .topbar {
      position: absolute;
      top: max(14px, calc(env(safe-area-inset-top) + 8px));
      left: 16px;
      right: 16px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      z-index: 3;
    }
    .brand {
      justify-self: start;
      font-weight: 750;
      letter-spacing: .02em;
      font-size: 15px;
      text-shadow: 0 2px 20px rgba(0,0,0,.35);
    }
    .session-stats {
      justify-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      min-height: 40px;
      padding: 5px 10px;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
      color: rgba(255,255,255,.94);
      font-size: 10px;
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: .01em;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .session-stats .stat-line { display: block; }
    .session-stats .session-timer,
    .session-stats .day-timer { font-size: 12px; font-weight: 800; }
    .top-actions { justify-self:end; display:flex; align-items:center; gap:8px; }
    .open-saved { justify-self: end; }
    .settings-link { text-decoration:none; font-size:18px; }
    .brand small { opacity: .62; font-weight: 600; margin-left: 7px; }

    .icon-btn {
      appearance: none;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: white;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }

    .content {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: max(132px, calc(env(safe-area-inset-bottom) + 112px));
      max-width: 560px;
      margin: auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .topic {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .17em;
      text-transform: uppercase;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 999px;
      background: rgba(0,0,0,.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: rgba(255,255,255,.84);
    }

    .text {
      margin: 0;
      font-size: clamp(30px, 8.7vw, 43px);
      line-height: 1.08;
      letter-spacing: -0.032em;
      font-weight: 760;
      text-wrap: balance;
      text-shadow: 0 4px 30px rgba(0,0,0,.48);
    }

    .hint {
      position: absolute;
      bottom: max(24px, calc(env(safe-area-inset-bottom) + 14px));
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,.66);
      font-size: 12px;
      letter-spacing: .04em;
      white-space: nowrap;
      pointer-events: none;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.55; transform:translateX(-50%) translateY(0)} 50%{opacity:.95; transform:translateX(-50%) translateY(-5px)} }

    .favorite {
      position: absolute;
      right: 18px;
      bottom: max(74px, calc(env(safe-area-inset-bottom) + 58px));
      width: 54px;
      height: 54px;
      font-size: 22px;
    }
    .favorite.saved { background: rgba(255,255,255,.92); color: #111; }

    .game-line { color: rgba(255,255,255,.98); font-weight: 850; }
    .goal-line { color: rgba(255,255,255,.82); }
    .goal-track {
      display:block;
      width:118px;
      height:4px;
      margin-top:2px;
      overflow:hidden;
      border-radius:999px;
      background:rgba(255,255,255,.16);
    }
    .goal-fill {
      display:block;
      width:0%;
      height:100%;
      border-radius:inherit;
      background:#fff;
      transition:width .28s ease;
    }

    .reward-overlay {
      position:fixed;
      inset:0;
      z-index:80;
      display:grid;
      place-items:center;
      padding:24px;
      background:rgba(0,0,0,.68);
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }
    .reward-overlay.open { opacity:1; pointer-events:auto; }
    .reward-card {
      width:min(360px,100%);
      padding:28px 22px 22px;
      border:1px solid rgba(255,255,255,.18);
      border-radius:30px;
      background:linear-gradient(180deg,#222,#111);
      box-shadow:0 30px 100px rgba(0,0,0,.58), 0 0 70px rgba(255,255,255,.08);
      text-align:center;
      transform:scale(.88) translateY(16px);
      transition:transform .24s cubic-bezier(.2,.9,.2,1);
    }
    .reward-overlay.open .reward-card { transform:scale(1) translateY(0); }
    .reward-emoji { font-size:58px; line-height:1; margin-bottom:14px; animation:rewardPop .55s cubic-bezier(.2,.9,.2,1); }
    .reward-title { font-size:26px; line-height:1.06; font-weight:850; letter-spacing:-.035em; }
    .reward-text { margin:10px auto 20px; max-width:290px; color:rgba(255,255,255,.72); font-size:14px; line-height:1.4; }
    .reward-button { width:100%; border:0; border-radius:17px; padding:14px 16px; background:#fff; color:#111; font-weight:850; cursor:pointer; }
    @keyframes rewardPop { 0%{transform:scale(.5) rotate(-8deg)} 70%{transform:scale(1.12) rotate(3deg)} 100%{transform:scale(1) rotate(0)} }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 34px;
      transform: translate(-50%, 18px);
      opacity: 0;
      background: rgba(18,18,18,.88);
      border: 1px solid rgba(255,255,255,.12);
      color: white;
      border-radius: 999px;
      padding: 11px 16px;
      font-size: 14px;
      z-index: 20;
      pointer-events: none;
      transition: .22s ease;
      backdrop-filter: blur(12px);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      z-index: 30;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

    .drawer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: min(78dvh, 760px);
      background: #111;
      border-radius: 28px 28px 0 0;
      transform: translateY(102%);
      transition: .28s cubic-bezier(.2,.8,.2,1);
      z-index: 31;
      padding: 18px 18px max(20px, calc(env(safe-area-inset-bottom) + 12px));
      overflow-y: auto;
      box-shadow: 0 -30px 80px rgba(0,0,0,.4);
    }
    .drawer::before { content:""; display:block; width:42px; height:5px; border-radius:999px; background:rgba(255,255,255,.18); margin:0 auto 16px; }
    .drawer.open { transform: translateY(0); }
    .drawer-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
    .drawer h2 { margin:0; font-size: 25px; letter-spacing:-.025em; }
    .saved-list { display:grid; gap:12px; }
    .saved-card {
      min-height: 145px;
      border-radius: 22px;
      padding: 20px;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      position:relative;
      overflow:hidden;
      background-size:cover;
      background-position:center;
      border: 1px solid rgba(255,255,255,.09);
    }
    .saved-card::before { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.76)); }
    .saved-card > * { position:relative; z-index:1; }
    .saved-card .mini-topic { font-size:10px; opacity:.7; text-transform:uppercase; letter-spacing:.12em; margin-bottom:8px; }
    .saved-card p { margin:0; font-size:18px; line-height:1.2; font-weight:700; }
    .empty { opacity:.62; padding: 40px 8px; text-align:center; line-height:1.5; }
    .count-badge { min-width:20px; height:20px; padding:0 6px; border-radius:999px; background:#fff; color:#111; display:inline-grid; place-items:center; font-size:11px; font-weight:800; position:absolute; transform:translate(12px,-12px); }

    @media (max-width: 700px) {
      .brand small { display:none; }
      .topic { font-size: 11px; padding: 7px 10px; }
      .saved-card { min-height: 132px; border-radius: 20px; }
    }

    /* On desktop, show the exact phone UI as a centered preview. */
    @media (min-width: 701px) {
      body { display:grid; place-items:center; background:#090909; }
      #feed { width:min(430px, 100vw); height:min(900px, 100dvh); border-radius:30px; overflow-y:auto; box-shadow:0 30px 90px rgba(0,0,0,.45); }
      .card { height:min(900px, 100dvh); }
      .drawer { left:50%; right:auto; width:min(430px, 100vw); transform:translate(-50%, 102%); }
      .drawer.open { transform:translate(-50%, 0); }
      .drawer-backdrop { background:rgba(0,0,0,.65); }
      .toast { bottom:40px; }
    }

    @media (orientation: landscape) and (max-height: 560px) {
      .content { bottom: 76px; }
      .text { font-size: clamp(24px, 5vw, 34px); }
      .favorite { bottom: 18px; }
      .hint { display:none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

    function safeStorageGet(key) {
      try { return localStorage.getItem(key); } catch { return null; }
    }

    function safeStorageSet(key, value) {
      try { localStorage.setItem(key, value); return true; } catch { return false; }
    }

    function readStoredJson(key, fallback) {
      try {
        const raw = safeStorageGet(key);
        if (raw == null) return fallback;
        const value = JSON.parse(raw);
        return value ?? fallback;
      } catch {
        return fallback;
      }
    }

    const deletedAffirmationIds = new Set((() => {
      const value = readStoredJson(DELETED_AFFIRMATIONS_KEY, []);
      return Array.isArray(value) ? value : [];
    })());

    const customAffirmations = (() => {
      const value = readStoredJson(CUSTOM_AFFIRMATIONS_KEY, []);
      if (!Array.isArray(value)) return [];
      return value.filter(item =>
        item && typeof item.id === 'string' && typeof item.text === 'string' &&
        item.text.trim() && THEMES[item.theme]
      ).map(item => ({ id:item.id, theme:item.theme, text:item.text.trim() }));
    })();

    const editedAffirmations = (() => {
      const value = readStoredJson(EDITED_AFFIRMATIONS_KEY, {});
      return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
    })();

      const edit = editedAffirmations[item.id];
      if (!edit || typeof edit.text !== 'string' || !edit.text.trim() || !THEMES[edit.theme]) return item;
      return { ...item, text:edit.text.trim(), theme:edit.theme };
    });

    function affirmationTextKey(text) {
      return String(text || '').trim().toLocaleLowerCase('ru-RU').replace(/\s+/g, ' ').replace(/[.!?…]+$/g, '');
    }

    function uniqueAffirmationsByText(items) {
      const seen = new Set();
      return items.filter(item => {
        const key = affirmationTextKey(item.text);
        if (!key || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    const effectiveAffirmations = [
      ...editedBaseAffirmations.filter(item => !deletedAffirmationIds.has(item.id)),
      ...customAffirmations.filter(item => !deletedAffirmationIds.has(item.id))

    function normalizeGameState(value) {
      const src = value && typeof value === 'object' && !Array.isArray(value) ? value : {};
      return {
        totalXp: Math.max(0, Math.floor(Number(src.totalXp) || 0)),
        totalCards: Math.max(0, Math.floor(Number(src.totalCards) || 0)),
        streak: Math.max(0, Math.floor(Number(src.streak) || 0)),
        lastGoalDate: typeof src.lastGoalDate === 'string' ? src.lastGoalDate : '',
        lastCycleGoalDate: typeof src.lastCycleGoalDate === 'string' ? src.lastCycleGoalDate : '',
        cycles: Math.max(0, Math.floor(Number(src.cycles) || 0)),
        achievements: Array.isArray(src.achievements) ? [...new Set(src.achievements.filter(x => typeof x === 'string'))] : []
      };

      const value = safeStorageGet(HAPTICS_KEY);

    function haptic(pattern) {
      if (!hapticsEnabled() || !navigator.vibrate) return;
      try { navigator.vibrate(pattern); } catch {}

    function previousDateKey(key) {
      const [y,m,d] = key.split('-').map(Number);
      const date = new Date(y, m - 1, d, 12, 0, 0);
      date.setDate(date.getDate() - 1);
      const yy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const dd = String(date.getDate()).padStart(2, '0');
      return `${yy}-${mm}-${dd}`;
    }

    function visibleStreak() {
      if (!gameState.lastGoalDate) return 0;
      if (gameState.lastGoalDate === dayKey || gameState.lastGoalDate === previousDateKey(dayKey)) return gameState.streak;
      return 0;
    }

    function updateGameHud() {
      const level = gameLevel();
      const goalDone = gameState.lastCycleGoalDate === dayKey;
      const activeCard = feed.querySelector('.card.active');
      const remaining = Number(activeCard?.dataset.cycleRemaining);
      const progress = Number.isFinite(remaining) && AFFIRMATIONS.length
        ? Math.min(100, Math.max(0, (AFFIRMATIONS.length - remaining) / AFFIRMATIONS.length * 100))
        : 0;
      document.querySelectorAll('.streak-count').forEach(el => el.textContent = visibleStreak());
      document.querySelectorAll('.xp-count').forEach(el => el.textContent = gameState.totalXp);
      document.querySelectorAll('.level-count').forEach(el => el.textContent = level);
      document.querySelectorAll('.goal-progress').forEach(el => el.textContent = '1 круг');
      document.querySelectorAll('.goal-line, .goal-track').forEach(el => el.style.display = goalDone ? 'none' : '');
      document.querySelectorAll('.goal-fill').forEach(el => el.style.width = `${progress}%`);
    }

    function presentNextReward() {
      if (rewardShowing || !rewardQueue.length) return;
      const reward = rewardQueue.shift();
      rewardShowing = true;
      rewardEmoji.textContent = reward.emoji;
      rewardTitle.textContent = reward.title;
      rewardText.textContent = reward.text;
      rewardOverlay.classList.add('open');
      haptic(reward.pattern || 50);
    }

    function showReward(emoji, title, text, pattern) {
      rewardQueue.push({ emoji, title, text, pattern });
      presentNextReward();

      setTimeout(presentNextReward, 180);
    }

    rewardClose.addEventListener('click', closeReward);
    rewardOverlay.addEventListener('click', (e) => { if (e.target === rewardOverlay) closeReward(); });

    function addXp(amount) {
      const oldLevel = gameLevel();
      gameState.totalXp += Math.max(0, Math.floor(amount));
      saveGameState();
      updateGameHud();
      return { oldLevel, newLevel: gameLevel() };
    }

    function announceLevelUp(change) {
      if (change.newLevel <= change.oldLevel) return;
      showReward('⭐', `Уровень ${change.newLevel}`, `У тебя уже ${gameState.totalXp} XP.`, [80,50,120]);
    }

    function unlockAchievement(id, emoji, title, text) {
      if (gameState.achievements.includes(id)) return false;
      gameState.achievements.push(id);
      saveGameState();
      showReward(emoji, title, text, [100,50,100,50,180]);
      return true;
    }

    function checkAchievements() {
      if (gameState.totalCards >= 100) unlockAchievement('cards100', '💯', '100 карт', 'Первая сотня прочитанных аффирмаций.');
      if (gameState.totalCards >= 500) unlockAchievement('cards500', '🏅', '500 карт', 'Уже 500 прочитанных карт.');
      if (gameState.totalCards >= 1000) unlockAchievement('cards1000', '🏆', '1000 карт', 'Ты прочитал 1000 карт.');
      if (gameState.streak >= 7) unlockAchievement('streak7', '🔥', '7 дней подряд', 'Неделя с выполненной дневной целью.');
      if (gameState.streak >= 30) unlockAchievement('streak30', '🔥', '30 дней подряд', 'Месяц стабильной практики.');
      if (gameState.cycles >= 1) unlockAchievement('cycle1', '🔄', 'Первый полный круг', 'Ты прошёл всю активную колоду.');
      if (gameState.cycles >= 10) unlockAchievement('cycle10', '👑', '10 полных кругов', 'Десять полных проходов по колоде.');
      if (gameLevel() >= 5) unlockAchievement('level5', '⭐', '5 уровень', 'Ты достиг 5 уровня.');
      if (gameLevel() >= 10) unlockAchievement('level10', '🌟', '10 уровень', 'Ты достиг 10 уровня.');
    }

    function completeDailyGoalIfNeeded(showCelebration = true) {
      if (gameState.lastCycleGoalDate === dayKey) return;
      const yesterday = previousDateKey(dayKey);
      if (gameState.lastGoalDate !== dayKey) {
        gameState.streak = gameState.lastGoalDate === yesterday ? gameState.streak + 1 : 1;
      }
      gameState.lastGoalDate = dayKey;
      gameState.lastCycleGoalDate = dayKey;
      saveGameState();
      const levelChange = addXp(XP_DAILY_GOAL);
      if (showCelebration) {
        showReward('🎯', 'Цель дня выполнена!', `1 полный круг · +${XP_DAILY_GOAL} XP · 🔥 ${gameState.streak} дн.`, [60,40,60]);
      }
      announceLevelUp(levelChange);
      checkAchievements();
      updateGameHud();
    }

    function completeCycle(card) {
      if (!card || card.dataset.cycleRemaining !== '0' || card.dataset.cycleAwarded === '1') return;
      card.dataset.cycleAwarded = '1';
      gameState.cycles += 1;
      saveGameState();
      completeDailyGoalIfNeeded(true);
      const levelChange = addXp(XP_FULL_CYCLE);
      showReward('🔄', 'Полный круг!', `Вся колода пройдена · +${XP_FULL_CYCLE} XP`, [120,60,120,60,220]);
      announceLevelUp(levelChange);
      checkAchievements();
    }

    function recordViewedCard(card) {
      viewedCount += 1;
      persistViewedCount();
      gameState.totalCards += 1;
      const levelChange = addXp(XP_PER_CARD);
      completeCycle(card);
      announceLevelUp(levelChange);
      checkAchievements();
      updateSessionStats();
    }

    saveGameState();

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      if (hours > 0) return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function activeDelta(now = performance.now()) {
      return sessionRunning ? Math.max(0, now - activeStartedAt) : 0;
    }

    function currentSessionElapsedMs(now = performance.now()) {
      return sessionElapsedMs + activeDelta(now);
    }

    function currentDayElapsedMs(now = performance.now()) {
      return dayElapsedMs + activeDelta(now);
    }

    function persistDay(value = dayElapsedMs) {
      safeStorageSet(DAILY_TIME_PREFIX + dayKey, String(Math.round(value)));
    }

    function persistViewedCount() {
      safeStorageSet(DAILY_CARDS_PREFIX + dayKey, String(viewedCount));
    }

    function rollDayIfNeeded() {
      const nextKey = localDateKey();
      if (nextKey === dayKey) return;
      const now = performance.now();
      if (sessionRunning) {
        const delta = Math.max(0, now - activeStartedAt);
        sessionElapsedMs += delta;
        dayElapsedMs += delta;
        activeStartedAt = now;
      }
      persistDay(dayElapsedMs);
      persistViewedCount();
      dayKey = nextKey;
      dayElapsedMs = Number(safeStorageGet(DAILY_TIME_PREFIX + dayKey) || 0);
      viewedCount = Number(safeStorageGet(DAILY_CARDS_PREFIX + dayKey) || 0);
      if (!Number.isFinite(viewedCount) || viewedCount < 0) viewedCount = 0;
      viewedCount = Math.floor(viewedCount);
      viewedCards = new WeakSet();
      updateGameHud();
    }

    function updateSessionStats() {
      rollDayIfNeeded();
      const now = performance.now();
      const sessionTime = formatTime(currentSessionElapsedMs(now));
      const dayTime = formatTime(currentDayElapsedMs(now));
      document.querySelectorAll('.session-timer').forEach(el => el.textContent = sessionTime);
      document.querySelectorAll('.day-timer').forEach(el => el.textContent = dayTime);
      document.querySelectorAll('.view-count').forEach(el => el.textContent = viewedCount);
      updateGameHud();
      if (sessionRunning && now - lastDailyPersist > 2000) {
        persistDay(currentDayElapsedMs(now));
        lastDailyPersist = now;
      }
    }

    function stopRunningSession(endAt = performance.now()) {
      if (!sessionRunning) return;
      const delta = Math.max(0, endAt - activeStartedAt);
      sessionElapsedMs += delta;
      dayElapsedMs += delta;
      sessionRunning = false;
      persistDay(dayElapsedMs);
      updateSessionStats();
    }

    function clearIdleTimer() {
      if (idleTimer !== null) {
        clearTimeout(idleTimer);
        idleTimer = null;
      }
    }

    function endSessionOnIdle() {
      if (!sessionRunning) return;
      const now = performance.now();
      const idleFor = now - lastActivityAt;
      if (idleFor + 100 < IDLE_TIMEOUT_MS) {
        scheduleIdleCheck();
        return;
      }
      // Count up to the 30-second reading grace period, not the time left open after it.
      const endAt = Math.min(now, lastActivityAt + IDLE_TIMEOUT_MS);
      stopRunningSession(endAt);
      clearIdleTimer();
    }

    function scheduleIdleCheck() {
      clearIdleTimer();
      if (!sessionRunning) return;
      const remaining = Math.max(0, IDLE_TIMEOUT_MS - (performance.now() - lastActivityAt));
      idleTimer = setTimeout(endSessionOnIdle, remaining + 60);
    }

    function markActivity() {
      if (document.hidden || !document.hasFocus()) return;
      const now = performance.now();
      lastActivityAt = now;
      if (!sessionRunning) {
        // Activity after an idle timeout starts a genuinely new session.
        sessionElapsedMs = 0;
        activeStartedAt = now;
        sessionRunning = true;
        updateSessionStats();
      }
      scheduleIdleCheck();
    }

    function endSessionOnUnfocus() {
      rollDayIfNeeded();
      clearIdleTimer();
      stopRunningSession(performance.now());
    }

    function startNewSessionOnFocus() {
      rollDayIfNeeded();
      if (document.hidden || !document.hasFocus() || sessionRunning) return;
      const now = performance.now();
      sessionElapsedMs = 0;
      activeStartedAt = now;
      lastActivityAt = now;
      sessionRunning = true;
      updateSessionStats();
      scheduleIdleCheck();
    }

    setInterval(updateSessionStats, 250);
    if (sessionRunning) scheduleIdleCheck();

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) endSessionOnUnfocus();
      else startNewSessionOnFocus();
    });

    window.addEventListener('blur', endSessionOnUnfocus);
    window.addEventListener('focus', startNewSessionOnFocus);

    // Any real interaction keeps the reading session alive.
    feed.addEventListener('scroll', markActivity, { passive: true });
    feed.addEventListener('wheel', markActivity, { passive: true });
    document.addEventListener('pointerdown', markActivity, { passive: true });
    document.addEventListener('pointermove', markActivity, { passive: true });
    document.addEventListener('touchstart', markActivity, { passive: true });
    document.addEventListener('touchmove', markActivity, { passive: true });
    document.addEventListener('keydown', markActivity);

    window.addEventListener('beforeunload', () => {
      clearIdleTimer();
      if (sessionRunning) stopRunningSession(performance.now());
      else persistDay(dayElapsedMs);
    });

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const FAIR_QUEUE_KEY = 'affirm_fair_queue_v1';
    let fairQueueLoaded = false;
    let fairLastId = null;

    function fairSignature() {
      return AFFIRMATIONS.map(item => item.id).join(',');
    }

    function startFreshFairDeck() {
      deck = shuffle(AFFIRMATIONS);
      cursor = 0;
      if (deck.length > 1 && fairLastId && deck[0].id === fairLastId) {
        [deck[0], deck[1]] = [deck[1], deck[0]];
      }
    }

    function loadFairDeck() {
      const signature = fairSignature();
      const byId = new Map(AFFIRMATIONS.map(item => [item.id, item]));
      let state = null;
      try { state = JSON.parse(safeStorageGet(FAIR_QUEUE_KEY) || 'null'); } catch {}
      fairLastId = state && typeof state.lastId === 'string' ? state.lastId : null;
      if (state && state.signature === signature && Array.isArray(state.remaining)) {
        const restored = state.remaining.map(id => byId.get(id)).filter(Boolean);
        if (restored.length) {
          deck = restored;
          cursor = 0;
          fairQueueLoaded = true;
          return;
        }
      }
      startFreshFairDeck();
      fairQueueLoaded = true;
    }

    function persistFairDeck() {
      try {
        safeStorageSet(FAIR_QUEUE_KEY, JSON.stringify({
          signature: fairSignature(),
          remaining: deck.slice(cursor).map(item => item.id),
          lastId: fairLastId
        }));
      } catch {}
    }

    function nextItem() {
      if (!fairQueueLoaded) loadFairDeck();
      if (cursor >= deck.length) startFreshFairDeck();
      const item = deck[cursor++];
      fairLastId = item.id;
      const cycleRemaining = Math.max(0, deck.length - cursor);
      persistFairDeck();
      return { ...item, cycleRemaining };
    }

    function imageFor(item, salt = 0) {
      const images = THEMES[item.theme].images;
      const numeric = Number(item.id.replace(/\D/g,'')) + salt;
      return images[numeric % images.length];
    }

    function makeCard(item, index) {
      const card = document.createElement('section');
      card.className = 'card';
      card.dataset.id = item.id;
      card.dataset.cycleRemaining = String(item.cycleRemaining ?? '');
      const savedClass = saved.has(item.id) ? ' saved' : '';
      card.innerHTML = `
        <div class="bg" style="background-image:url('${imageFor(item,index)}')"></div>
        <div class="overlay"></div>
        <div class="topbar">
          <div class="brand">Affirm</div>
          <div class="session-stats" aria-label="Время сегодня и текущая сессия">
            <span class="stat-line">сессия <span class="session-timer">00:00</span></span>
            <span class="stat-line">сегодня <span class="day-timer">00:00</span> · <span class="view-count">0</span> карт.</span>
            <span class="stat-line">до нового круга <span class="cycle-remaining">${item.cycleRemaining}</span></span>
            <span class="stat-line game-line">🔥 <span class="streak-count">0</span> · ⭐ <span class="xp-count">0</span> XP · ур. <span class="level-count">1</span></span>
            <span class="stat-line goal-line">цель дня · <span class="goal-progress">1 круг</span></span>
            <span class="goal-track"><span class="goal-fill"></span></span>
          </div>
          <div class="top-actions">
            <a class="icon-btn settings-link" href="settings.html" aria-label="Настройки">⚙</a>
            <button class="icon-btn open-saved" aria-label="Открыть сохранённые">♡<span class="count-badge" ${saved.size ? '' : 'style="display:none"'}>${saved.size}</span></button>
          </div>
        </div>
        <div class="content">
          <div class="topic">${THEMES[item.theme].label}</div>
          <p class="text">${item.text}</p>
        </div>
        <button class="icon-btn favorite${savedClass}" aria-label="Сохранить">${saved.has(item.id) ? '♥' : '♡'}</button>
        ${initialHintVisible && index === 0 ? '<div class="hint">↑ свайпни вверх</div>' : ''}
      `;
      card.querySelector('.favorite').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleSave(item.id, card.querySelector('.favorite'));
      });
      card.querySelector('.open-saved').addEventListener('click', (e) => {
        e.stopPropagation();
        openDrawer();
      });
      return card;
    }

    function appendCards(n = 12) {
      const frag = document.createDocumentFragment();
      for (let i = 0; i < n; i++) frag.appendChild(makeCard(nextItem(), feed.children.length + i));
      feed.appendChild(frag);
      observeCards();
      updateBadges();
      updateSessionStats();
    }

    function toggleSave(id, button) {
      if (saved.has(id)) {
        saved.delete(id);
        button.classList.remove('saved');
        button.textContent = '♡';
        showToast('Удалено из сохранённых');
      } else {
        saved.add(id);
        button.classList.add('saved');
        button.textContent = '♥';
        showToast('Сохранено');
      }
      safeStorageSet(SAVED_KEY, JSON.stringify([...saved]));
      updateBadges();
      renderSaved();
    }

    function updateBadges() {
      document.querySelectorAll('.count-badge').forEach(b => {
        b.textContent = saved.size;
        b.style.display = saved.size ? 'grid' : 'none';
      });
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1200);
    }

    function renderSaved() {
      savedList.innerHTML = '';
      const items = AFFIRMATIONS.filter(x => saved.has(x.id));
      if (!items.length) {
        savedList.innerHTML = '<div class="empty">Здесь появятся аффирмации, которые ты сохранишь сердцем.</div>';
        return;
      }
      [...items].reverse().forEach((item, i) => {
        const el = document.createElement('div');
        el.className = 'saved-card';
        el.style.backgroundImage = `url('${imageFor(item,i)}')`;
        el.innerHTML = `<div class="mini-topic">${THEMES[item.theme].label}</div><p>${item.text}</p>`;
        savedList.appendChild(el);
      });
    }

    function openDrawer() {
      renderSaved();
      feed.style.overflowY = 'hidden';
      drawer.classList.add('open');
      backdrop.classList.add('open');
    }
    function closeDrawer() {
      feed.style.overflowY = 'auto';
      drawer.classList.remove('open');
      backdrop.classList.remove('open');
    }
    document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
    backdrop.addEventListener('click', closeDrawer);

    let observer;
    function observeCards() {
      if (observer) observer.disconnect();
      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          entry.target.classList.toggle('active', entry.isIntersecting && entry.intersectionRatio > .65);
          if (entry.isIntersecting && entry.intersectionRatio > .65) {
            initialHintVisible = false;
            if (!viewedCards.has(entry.target)) {
              viewedCards.add(entry.target);
              recordViewedCard(entry.target);
            }
            const idx = [...feed.children].indexOf(entry.target);
            if (feed.children.length - idx < 5) appendCards(10);
          }
        });
      }, { root: feed, threshold: [0.65] });
      [...feed.querySelectorAll('.card')].forEach(c => observer.observe(c));
    }

    document.addEventListener('keydown', (e) => {
      if (drawer.classList.contains('open')) {
        if (e.key === 'Escape') closeDrawer();
        return;
      }
      if (['ArrowDown','PageDown',' '].includes(e.key)) {
        e.preventDefault();
        feed.scrollBy({ top: innerHeight, behavior: 'smooth' });
      }
      if (['ArrowUp','PageUp'].includes(e.key)) {
        e.preventDefault();
        feed.scrollBy({ top: -innerHeight, behavior: 'smooth' });
      }
    });

    // Prevent instant accidental desktop wheel skipping through many cards.
    let wheelLock = false;
    feed.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaY) < 25 || wheelLock) return;
      wheelLock = true;
      setTimeout(() => wheelLock = false, 450);
    }, { passive: true });

    deck = shuffle(AFFIRMATIONS);
    appendCards(14);
    renderSaved();
    completeDailyGoalIfNeeded(true);
    checkAchievements();
    updateGameHud();
  </script>
</body>
</html>
