<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Affirm</title>
  <style>
    :root {
      --glass: rgba(10, 10, 10, 0.28);
      --glass-border: rgba(255, 255, 255, 0.18);
      --text: #fff;
      --muted: rgba(255,255,255,.72);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #0b0b0b; color: var(--text); font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
    body { touch-action: manipulation; }
    @supports (height: 100svh) { body { min-height: 100svh; } }
    button { font: inherit; }

    #feed {
      height: 100vh;
      height: 100dvh;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      scrollbar-width: none;
      background: #0b0b0b;
    }
    #feed::-webkit-scrollbar { display: none; }

    .card {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      overflow: hidden;
      background: #171717;
      isolation: isolate;
    }

    .bg {
      position: absolute;
      inset: -3%;
      background-position: center;
      background-size: cover;
      transform: scale(1.04);
      transition: transform 8s ease;
      z-index: -3;
    }
    .card.active .bg { transform: scale(1.12); }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(180deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,.12) 35%, rgba(0,0,0,.46) 70%, rgba(0,0,0,.72) 100%),
        radial-gradient(circle at 50% 38%, rgba(0,0,0,.04), rgba(0,0,0,.38) 78%);
    }

    .topbar {
      position: absolute;
      top: max(14px, calc(env(safe-area-inset-top) + 8px));
      left: 16px;
      right: 16px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      z-index: 3;
    }
    .brand {
      justify-self: start;
      font-weight: 750;
      letter-spacing: .02em;
      font-size: 15px;
      text-shadow: 0 2px 20px rgba(0,0,0,.35);
    }
    .session-stats {
      justify-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      min-height: 40px;
      padding: 5px 10px;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
      color: rgba(255,255,255,.94);
      font-size: 10px;
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: .01em;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .session-stats .stat-line { display: block; }
    .session-stats .session-timer,
    .session-stats .day-timer { font-size: 12px; font-weight: 800; }
    .top-actions { justify-self:end; display:flex; align-items:center; gap:8px; }
    .open-saved { justify-self: end; }
    .settings-link { text-decoration:none; font-size:18px; }
    .brand small { opacity: .62; font-weight: 600; margin-left: 7px; }

    .icon-btn {
      appearance: none;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: white;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }

    .content {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: max(132px, calc(env(safe-area-inset-bottom) + 112px));
      max-width: 560px;
      margin: auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .topic {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .17em;
      text-transform: uppercase;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 999px;
      background: rgba(0,0,0,.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: rgba(255,255,255,.84);
    }

    .text {
      margin: 0;
      font-size: clamp(30px, 8.7vw, 43px);
      line-height: 1.08;
      letter-spacing: -0.032em;
      font-weight: 760;
      text-wrap: balance;
      text-shadow: 0 4px 30px rgba(0,0,0,.48);
    }

    .hint {
      position: absolute;
      bottom: max(24px, calc(env(safe-area-inset-bottom) + 14px));
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,.66);
      font-size: 12px;
      letter-spacing: .04em;
      white-space: nowrap;
      pointer-events: none;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.55; transform:translateX(-50%) translateY(0)} 50%{opacity:.95; transform:translateX(-50%) translateY(-5px)} }

    .favorite {
      position: absolute;
      right: 18px;
      bottom: max(74px, calc(env(safe-area-inset-bottom) + 58px));
      width: 54px;
      height: 54px;
      font-size: 22px;
    }
    .favorite.saved { background: rgba(255,255,255,.92); color: #111; }

    .game-line { color: rgba(255,255,255,.98); font-weight: 850; }
    .goal-line { color: rgba(255,255,255,.82); }
    .goal-track {
      display:block;
      width:118px;
      height:4px;
      margin-top:2px;
      overflow:hidden;
      border-radius:999px;
      background:rgba(255,255,255,.16);
    }
    .goal-fill {
      display:block;
      width:0%;
      height:100%;
      border-radius:inherit;
      background:#fff;
      transition:width .28s ease;
    }

    .reward-overlay {
      position:fixed;
      inset:0;
      z-index:80;
      display:grid;
      place-items:center;
      padding:24px;
      background:rgba(0,0,0,.68);
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }
    .reward-overlay.open { opacity:1; pointer-events:auto; }
    .reward-card {
      width:min(360px,100%);
      padding:28px 22px 22px;
      border:1px solid rgba(255,255,255,.18);
      border-radius:30px;
      background:linear-gradient(180deg,#222,#111);
      box-shadow:0 30px 100px rgba(0,0,0,.58), 0 0 70px rgba(255,255,255,.08);
      text-align:center;
      transform:scale(.88) translateY(16px);
      transition:transform .24s cubic-bezier(.2,.9,.2,1);
    }
    .reward-overlay.open .reward-card { transform:scale(1) translateY(0); }
    .reward-emoji { font-size:58px; line-height:1; margin-bottom:14px; animation:rewardPop .55s cubic-bezier(.2,.9,.2,1); }
    .reward-title { font-size:26px; line-height:1.06; font-weight:850; letter-spacing:-.035em; }
    .reward-text { margin:10px auto 20px; max-width:290px; color:rgba(255,255,255,.72); font-size:14px; line-height:1.4; }
    .reward-button { width:100%; border:0; border-radius:17px; padding:14px 16px; background:#fff; color:#111; font-weight:850; cursor:pointer; }
    @keyframes rewardPop { 0%{transform:scale(.5) rotate(-8deg)} 70%{transform:scale(1.12) rotate(3deg)} 100%{transform:scale(1) rotate(0)} }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 34px;
      transform: translate(-50%, 18px);
      opacity: 0;
      background: rgba(18,18,18,.88);
      border: 1px solid rgba(255,255,255,.12);
      color: white;
      border-radius: 999px;
      padding: 11px 16px;
      font-size: 14px;
      z-index: 20;
      pointer-events: none;
      transition: .22s ease;
      backdrop-filter: blur(12px);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      z-index: 30;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

    .drawer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: min(78dvh, 760px);
      background: #111;
      border-radius: 28px 28px 0 0;
      transform: translateY(102%);
      transition: .28s cubic-bezier(.2,.8,.2,1);
      z-index: 31;
      padding: 18px 18px max(20px, calc(env(safe-area-inset-bottom) + 12px));
      overflow-y: auto;
      box-shadow: 0 -30px 80px rgba(0,0,0,.4);
    }
    .drawer::before { content:""; display:block; width:42px; height:5px; border-radius:999px; background:rgba(255,255,255,.18); margin:0 auto 16px; }
    .drawer.open { transform: translateY(0); }
    .drawer-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
    .drawer h2 { margin:0; font-size: 25px; letter-spacing:-.025em; }
    .saved-list { display:grid; gap:12px; }
    .saved-card {
      min-height: 145px;
      border-radius: 22px;
      padding: 20px;
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      position:relative;
      overflow:hidden;
      background-size:cover;
      background-position:center;
      border: 1px solid rgba(255,255,255,.09);
    }
    .saved-card::before { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.76)); }
    .saved-card > * { position:relative; z-index:1; }
    .saved-card .mini-topic { font-size:10px; opacity:.7; text-transform:uppercase; letter-spacing:.12em; margin-bottom:8px; }
    .saved-card p { margin:0; font-size:18px; line-height:1.2; font-weight:700; }
    .empty { opacity:.62; padding: 40px 8px; text-align:center; line-height:1.5; }
    .count-badge { min-width:20px; height:20px; padding:0 6px; border-radius:999px; background:#fff; color:#111; display:inline-grid; place-items:center; font-size:11px; font-weight:800; position:absolute; transform:translate(12px,-12px); }

    @media (max-width: 700px) {
      .brand small { display:none; }
      .topic { font-size: 11px; padding: 7px 10px; }
      .saved-card { min-height: 132px; border-radius: 20px; }
    }

    /* On desktop, show the exact phone UI as a centered preview. */
    @media (min-width: 701px) {
      body { display:grid; place-items:center; background:#090909; }
      #feed { width:min(430px, 100vw); height:min(900px, 100dvh); border-radius:30px; overflow-y:auto; box-shadow:0 30px 90px rgba(0,0,0,.45); }
      .card { height:min(900px, 100dvh); }
      .drawer { left:50%; right:auto; width:min(430px, 100vw); transform:translate(-50%, 102%); }
      .drawer.open { transform:translate(-50%, 0); }
      .drawer-backdrop { background:rgba(0,0,0,.65); }
      .toast { bottom:40px; }
    }

    @media (orientation: landscape) and (max-height: 560px) {
      .content { bottom: 76px; }
      .text { font-size: clamp(24px, 5vw, 34px); }
      .favorite { bottom: 18px; }
      .hint { display:none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    [hidden] { display:none !important; }
    .storage-warning { position:fixed; bottom:8px; left:16px; right:16px; z-index:100; padding:12px; background:#6a3d13; color:#fff; border-radius:12px; font-size:13px; text-align:center; }
    .feed-empty { height:100%; display:grid; place-content:center; padding:28px; }
    .feed-empty a { color:#fff; }
    .long-text .text { font-size:clamp(20px,5vw,27px); line-height:1.25; max-height:calc(100dvh - 310px); overflow-y:auto; overflow-wrap:anywhere; overscroll-behavior:contain; }
  </style>
</head>
<body>
  <div id="storageWarning" class="storage-warning" role="status" hidden>Браузер не разрешил сохранять данные. Изменения действуют только до закрытия страницы; сделай резервную копию в настройках.</div>
  <main id="feed" aria-label="Лента аффирмаций"></main>

  <div class="drawer-backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer" aria-label="Сохранённые аффирмации">
    <div class="drawer-head">
      <h2>Сохранённое</h2>
      <button class="icon-btn" id="closeDrawer" aria-label="Закрыть">✕</button>
    </div>
    <div id="savedList" class="saved-list"></div>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite">Сохранено</div>

  <div class="reward-overlay" id="rewardOverlay" role="dialog" aria-modal="true" aria-labelledby="rewardTitle">
    <div class="reward-card">
      <div class="reward-emoji" id="rewardEmoji">🏆</div>
      <div class="reward-title" id="rewardTitle">Достижение</div>
      <div class="reward-text" id="rewardText"></div>
      <button class="reward-button" id="rewardClose" type="button">Продолжить</button>
    </div>
  </div>

  <script src="assets/catalog.js"></script>
  <script src="assets/state.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
