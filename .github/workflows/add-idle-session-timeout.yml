name: Deploy inactivity-aware session timer

on:
  push:
    paths:
      - '.github/workflows/add-idle-session-timeout.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add idle timeout
        run: python .github/add-idle-session-timeout.py
      - name: Commit timer fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'End sessions after inactivity'
          git push
