name: Add Duolingo-style mechanics

on:
  push:
    paths:
      - '.github/workflows/add-duolingo-mechanics.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply mechanics
        run: python .github/add_duolingo_mechanics.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('index.html', 'settings.html'):
              s = Path(name).read_text(encoding='utf-8')
              scripts = re.findall(r'<script>(.*?)</script>', s, flags=re.S)
              Path(f'/tmp/{name}.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/index.html.js
          node --check /tmp/settings.html.js
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html settings.html
          git commit -m 'Add streak XP levels achievements and haptics'
          git push
