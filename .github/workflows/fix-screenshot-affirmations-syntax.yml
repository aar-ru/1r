name: Fix settings parser

on:
  push:
    paths:
      - '.github/workflows/fix-screenshot-affirmations-syntax.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix settings parser
        run: python .github/fix_settings_trailing_comma.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add settings.html .github/add_affirm_editing.py
          git commit -m 'Fix settings parser for trailing commas'
          git push
