name: Add Affirm editing

on:
  push:
    paths:
      - '.github/workflows/add-affirm-editing.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app for editing
        run: python .github/add_affirm_editing.py
      - name: Commit editing support
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html settings.html
          git commit -m 'Add affirmation editing in settings'
          git push
