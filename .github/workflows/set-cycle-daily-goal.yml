name: Set one-cycle daily goal

on:
  push:
    paths:
      - '.github/workflows/set-cycle-daily-goal.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply goal migration
        run: python .github/set-cycle-daily-goal.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text()
          m=re.search(r'<script>([\s\S]*)</script>', s)
          Path('/tmp/index.js').write_text(m.group(1))
          subprocess.check_call(['node','--check','/tmp/index.js'])
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Make one full cycle the daily goal" || exit 0
          git push
