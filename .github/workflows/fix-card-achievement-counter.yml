name: Fix card achievement counter
on:
  push:
    paths:
      - .github/workflows/fix-card-achievement-counter.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python .github/fix_card_achievement_counter.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          start = html.index('<script>') + len('<script>')
          end = html.rindex('</script>')
          Path('/tmp/app.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix retroactive card achievements"
            git push
          fi
