name: Update full diary affirmations

on:
  push:
    paths:
      - '.github/workflows/update-full-diary.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install full diary corpus
        run: python .github/update_full_diary.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Expand Affirm with full diary corpus'
          git push
