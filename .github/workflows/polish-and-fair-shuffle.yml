name: Polish affirmations and fair shuffle

on:
  push:
    paths:
      - '.github/workflows/polish-and-fair-shuffle.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish corpus and enable fair shuffle
        run: python .github/polish_and_fair_shuffle.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html settings.html data/user_affirmations_exact.json
          git commit -m 'Polish affirmations and prevent feed repeats'
          git push
