name: Neutralize relationship wording

on:
  push:
    paths:
      - '.github/workflows/neutralize-yana.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace name with neutral wording
        run: python .github/neutralize_yana.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/update_full_diary.py
          git commit -m 'Replace Yana with neutral wording'
          git push
