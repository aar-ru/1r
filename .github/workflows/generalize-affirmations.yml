name: Generalize affirmation wording

on:
  push:
    paths:
      - '.github/workflows/generalize-affirmations.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean up wording
        run: python .github/generalize_affirmations.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/update_full_diary.py
          git commit -m 'Generalize affirmation wording'
          git push
