name: Restore curated affirmations

on:
  push:
    paths:
      - '.github/workflows/restore-curated.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last curated app
        run: git show 5b4a52883be2539fbe7bb10598fdd3a7a8b9063e:index.html > index.html
      - name: Commit restore
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore curated affirmation set'
          git push
