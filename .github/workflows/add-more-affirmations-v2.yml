name: Add more affirmations v2
on:
  push:
    paths:
      - .github/workflows/add-more-affirmations-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add affirmations
        run: python .github/add_more_affirmations_v2.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          start = html.index("<script>") + len("<script>")
          end = html.rindex("</script>")
          Path("/tmp/app.js").write_text(html[start:end], encoding="utf-8")
          PY
          node --check /tmp/app.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add 100 more affirmations"
            git push
          fi
