name: Update Affirm content

on:
  push:
    paths:
      - '.github/workflows/update-affirm-content.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update app content
        run: python .github/update_affirm.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use diary thoughts and people-free backgrounds'
          git push
