name: Build 500 short affirmations

on:
  push:
    paths:
      - '.github/workflows/build-500-short.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build corpus
        run: python .github/build_500_short.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Expand Affirm to 500 short phrases'
          git push
