name: Harden storage startup

on:
  push:
    paths:
      - '.github/workflows/harden-storage-startup.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden storage startup
        run: python .github/harden_storage_startup.py
      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/app.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>', s, flags=re.S)), encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Harden startup when browser storage is unavailable'
          git push
