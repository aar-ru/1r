name: Update daily and session timers

on:
  push:
    paths:
      - '.github/workflows/update-daily-time.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update timers
        run: python .github/update_daily_time.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Track daily and session time'
          git push
