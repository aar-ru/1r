name: Fix daily round goal
on:
  push:
    paths:
      - '.github/fix-daily-round-goal.py'
      - '.github/workflows/fix-daily-round-goal.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python .github/fix-daily-round-goal.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          start=s.index('<script>')+len('<script>')
          end=s.index('</script>', start)
          Path('/tmp/app.js').write_text(s[start:end])
          PY
          node --check /tmp/app.js
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix daily goal completion to count viewed cards"
          git push
