name: Install stronger affirmations

on:
  push:
    paths:
      - '.github/workflows/install-strong-affirmations.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stronger corpus
        run: python .github/install_strong_affirmations.py
      - name: Commit stronger corpus
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Strengthen affirmation wording'
          git push

# retry with curated source files
