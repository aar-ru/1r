name: Add screenshot affirmations

on:
  push:
    paths:
      - '.github/workflows/add-screenshot-affirmations.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add screenshot affirmations
        run: python .github/add_screenshot_affirmations.py
      - name: Commit additions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/user_affirmations_exact.json
          git commit -m 'Add affirmations from screenshots'
          git push
