name: Install exact user affirmations

on:
  push:
    paths:
      - '.github/workflows/install-user-exact-affirmations.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install exact corpus
        run: python .github/install-user-exact-affirmations.py
      - name: Commit exact corpus
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use exact user affirmation corpus'
          git push
