name: Polish curated 500 affirmations

on:
  push:
    paths:
      - '.github/workflows/polish-curated-500.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish corpus
        run: python .github/polish_curated_500.py
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/deploy_curated_500.py
          git commit -m 'Polish curated affirmation wording'
          git push

